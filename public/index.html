<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Organize your day</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Navigation -->
    <nav id="navbar" class="navbar hidden">
      <div class="nav-brand">TaskFlow</div>
      <div class="nav-links">
        <button id="nav-dashboard" class="nav-link active">Tasks</button>
        <button id="nav-stats" class="nav-link">Stats</button>
        <button id="nav-logout" class="nav-link">Log out</button>
      </div>
    </nav>

    <!-- Landing Page -->
    <section id="landing" class="view">
      <div class="landing-content">
        <h1 class="landing-title">TaskFlow</h1>
        <p class="landing-subtitle">A calm space to organize your daily tasks.</p>
        <div class="landing-actions">
          <button id="btn-go-signup" class="btn btn-primary">Get started</button>
          <button id="btn-go-login" class="btn btn-secondary">I already have an account</button>
        </div>
        <div class="landing-preview">
          <div class="preview-card">
            <div class="preview-header">
              <span class="preview-dot"></span>
              <span class="preview-dot"></span>
              <span class="preview-dot"></span>
            </div>
            <div class="preview-body">
              <div class="preview-line"></div>
              <div class="preview-line short"></div>
              <div class="preview-task done">
                <span class="preview-check">✓</span>
                <span class="preview-text">Buy groceries</span>
              </div>
              <div class="preview-task">
                <span class="preview-check"></span>
                <span class="preview-text">Walk the dog</span>
              </div>
              <div class="preview-task done">
                <span class="preview-check">✓</span>
                <span class="preview-text">Read a book</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Signup -->
    <section id="signup" class="view hidden">
      <div class="auth-card">
        <h2 class="auth-title">Create account</h2>
        <form id="signup-form">
          <label class="label">Email</label>
          <input type="email" id="signup-email" class="input" placeholder="you@example.com" required>
          <label class="label">Password</label>
          <input type="password" id="signup-password" class="input" placeholder="••••••••" required minlength="6">
          <p id="signup-error" class="error hidden"></p>
          <button type="submit" class="btn btn-primary full">Sign up</button>
        </form>
        <p class="auth-footer">Already have an account? <button id="btn-to-login" class="link">Log in</button></p>
      </div>
    </section>

    <!-- Login -->
    <section id="login" class="view hidden">
      <div class="auth-card">
        <h2 class="auth-title">Welcome back</h2>
        <form id="login-form">
          <label class="label">Email</label>
          <input type="email" id="login-email" class="input" placeholder="you@example.com" required>
          <label class="label">Password</label>
          <input type="password" id="login-password" class="input" placeholder="••••••••" required>
          <p id="login-error" class="error hidden"></p>
          <button type="submit" class="btn btn-primary full">Log in</button>
        </form>
        <p class="auth-footer">Don't have an account? <button id="btn-to-signup" class="link">Sign up</button></p>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="dashboard" class="view hidden">
      <div class="dashboard-container">
        <div class="add-task">
          <input type="text" id="task-title" class="input task-input" placeholder="What needs to be done?" required>
          <button id="btn-add-task" class="btn btn-primary">Add task</button>
        </div>
        <div id="tasks-list" class="tasks-list"></div>
      </div>
    </section>

    <!-- Stats -->
    <section id="stats" class="view hidden">
      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-done">0</div>
          <div class="stat-label">Done</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-open">0</div>
          <div class="stat-label">Open</div>
        </div>
      </div>
    </section>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
